# Install once:  pip install pre-commit && pre-commit install
# Blocks commits that contain secrets or obvious insecure Python before they reach history.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-q", "-ll", "-x", "tests,platform/tests,platform/pentest,sim-core/redteam/tests,sim-core/training/tests,sim-core/security/tests"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: no-committed-env
        name: refuse .env files and dev data keys
        entry: refuse committed secrets files
        language: fail
        files: '(^|/)\.env$|\.env\.(?!example$)[^/]+$|\.datakey$|\.pem$|\.key$'
