name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
permissions:
  contents: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    strategy:
      matrix: { language: [python, javascript] }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: { languages: "${{ matrix.language }}", queries: security-extended }
      - uses: github/codeql-action/analyze@v4
  python-sast-and-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install bandit pip-audit
      - name: Bandit (static analysis)
        run: bandit -q -r platform/airspace sim-core -x sim-core/redteam/tests,sim-core/training/tests,sim-core/security/tests -ll
      - name: pip-audit (known CVEs in pinned deps)
        run: |
          pip-audit -r platform/requirements.txt
          pip-audit -r sim-core/requirements.txt
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
