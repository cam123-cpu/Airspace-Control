name: Bug report
description: Something isn't working (for security issues, use private vulnerability reporting instead)
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [simulator, drone-watch-live, platform, sim-core, browser-model, docs]
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: Steps to reproduce, expected vs. actual }
    validations: { required: true }
